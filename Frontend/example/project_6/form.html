<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户信息表单</title>
</head>
<body>
    <h2>用户注册表单</h2>
    <!-- 表单提交方式为POST，action指向Servlet路径 -->
    <form action="formServlet" method="post">
        <!-- 文本字段 text -->
        用户名：<input type="text" name="username" placeholder="请输入用户名"><br><br>

        <!-- 密码框 password -->
        密码：<input type="password" name="password" placeholder="请输入密码"><br><br>

        <!-- 文本区域 textarea -->
        个人简介：<textarea name="intro" rows="5" cols="30" placeholder="请输入个人简介"></textarea><br><br>

        <!-- 单选按钮 radio -->
        性别：
        <input type="radio" name="gender" value="男" checked>男
        <input type="radio" name="gender" value="女">女<br><br>

        <!-- 复选框 checkbox -->
        兴趣爱好：
        <input type="checkbox" name="hobbies" value="阅读">阅读
        <input type="checkbox" name="hobbies" value="运动">运动
        <input type="checkbox" name="hobbies" value="音乐">音乐
        <input type="checkbox" name="hobbies" value="旅行">旅行<br><br>

        <!-- 选择列表 select -->
        学历：
        <select name="education">
            <option value="高中">高中</option>
            <option value="大专">大专</option>
            <option value="本科" selected>本科</option>
            <option value="硕士">硕士</option>
            <option value="博士">博士</option>
        </select><br><br>

        <!-- 按钮button（重置）和提交按钮submit -->
        <input type="reset" value="重置">
        <input type="submit" value="提交">
    </form>
</body>
</html>
